name: TestSprite Verification

on:
  pull_request:
    branches: [main]

jobs:
  testsprite:
    name: TestSprite Loop Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install TestSprite CLI
        run: npm install -g @testsprite/testsprite-cli

      - name: Run frontend tests
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
          FRONTEND_PROJECT_ID: ${{ secrets.TESTSPRITE_PROJECT_ID }}
        run: |
          testsprite setup --from-env --yes --no-agent
          testsprite test rerun --all --project "$FRONTEND_PROJECT_ID" --wait --output json

      - name: Run backend API tests
        env:
          TESTSPRITE_API_KEY: ${{ secrets.TESTSPRITE_API_KEY }}
          BACKEND_PROJECT_ID: ${{ secrets.TESTSPRITE_BACKEND_PROJECT_ID }}
        run: |
          testsprite test rerun --all --project "$BACKEND_PROJECT_ID" --wait --output json

      - name: Download failure artifacts
        if: failure()
        run: |
          mkdir -p .testsprite/failures
          testsprite test list --project "${{ secrets.TESTSPRITE_PROJECT_ID }}" --status failed,blocked --output json \
            | jq -r '.items[].id' \
            | xargs -I{} testsprite test artifact get {} --out ".testsprite/failures/{}" || true

      - name: Upload failure bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testsprite-failure-bundles
          path: .testsprite/failures/

      - name: Upload MCP test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testsprite-mcp-report
          path: frontend/testsprite_tests/testsprite-mcp-test-report.html
