name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    name: Solidity Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: forge install

      - name: Run Forge tests
        run: forge test -vvv

  agent:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest

      - name: Run agent tests
        run: python -m pytest agent/test/ -v --tb=short

  lint:
    name: Python Lint + Import Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint dependencies
        run: pip install ruff

      - name: Run ruff
        run: ruff check --output-format=github agent/

      - name: Verify all imports
        run: |
          python -c "
          from agent.lib import (
              abi, axl_client, bundle_manifest, bundle_pack,
              chronicle, deadline_scheduler, ens_client,
              eth_rpc, fal_client, github_client,
              hydradb_client, indexer_client, jsonrpc,
              keeperhub_client, kimi_client, metadata_reader,
              mvp_verifier, peer_inbox, recovery,
              verdict_envelope, verifier_registry_reader,
              weft_milestone_reader, zero_storage,
          )
          print(f'All {len(dir())} modules imported OK')
          "

  secrets-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in staged changes
        run: |
          echo "🔍 Scanning for potential secrets..."
          HAS_SECRET=0
          # Patterns: private keys, API tokens
          while IFS= read -r -d '' file; do
            if grep -Pn '0x[0-9a-fA-F]{64,}' "$file" 2>/dev/null | grep -v '//.*0x\|/\*.*0x\|"0x[0-9a-f]\{64\}"' ; then
              echo "⚠️  Possible private key in $file"
              HAS_SECRET=1
            fi
            if grep -Pn '(sk-|kh_|modalresearch_|fal_key)[A-Za-z0-9_-]{20,}' "$file" 2>/dev/null; then
              echo "⚠️  Possible API token in $file"
              HAS_SECRET=1
            fi
          done < <(find . -name '*.py' -o -name '*.sh' -o -name '*.yml' -o -name '*.yaml' -o -name '*.md' -o -name '*.json' -o -name '*.toml' -o -name '*.sol' | grep -v node_modules | grep -v contracts/lib | grep -v .git | xargs -0 2>/dev/null || find . \( -name '*.py' -o -name '*.sh' -o -name '*.yml' -o -name '*.md' -o -name '*.json' -o -name '*.sol' \) -not -path '*/node_modules/*' -not -path '*/contracts/lib/*' -not -path '*/.git/*' -print0)
          if [ "$HAS_SECRET" -ne 0 ]; then
            echo "❌ Secrets found in source files!"
            exit 1
          fi
          echo "✅ No secrets detected."

  shellcheck:
    name: Shell Script Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./
          severity: warning
          ignore_paths: >
            node_modules .git contracts/lib

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_DEFAULT_CHAIN: sepolia
