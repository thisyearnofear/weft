<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Weft × KeeperHub — Agents Onchain Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body { margin:0; background:#09050f; color:#f0f0f5; font-family:'Inter',system-ui,sans-serif; overflow:hidden; width:1920px; height:1080px; }
    #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:radial-gradient(ellipse at 50% 30%, #12091f 0%, #09050f 70%); }
    canvas#bg-canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    [data-composition-id] > div[data-composition-id] { position:absolute; inset:0; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="keeperhub-demo" data-width="1920" data-height="1080" data-duration="63" data-start="0">
    <canvas id="bg-canvas" class="clip" data-start="0" data-duration="63" data-track-index="0"></canvas>

    <!-- Background music + narration -->
    <audio id="bgm" class="clip" data-start="0" data-duration="63" data-track-index="9" data-volume="0.28" src="assets/bgm.wav" preload="auto"></audio>
    <audio id="narration" class="clip" data-start="0" data-duration="63" data-track-index="10" data-volume="1" src="assets/narration.wav" preload="auto"></audio>

    <!-- Scene 1: Hook (0–8s) -->
    <div id="c-hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="8" data-width="1920" data-height="1080" data-track-index="1"></div>

    <!-- Scene 2: Problem (8–18s) -->
    <div id="c-problem" data-composition-id="problem" data-composition-src="compositions/problem.html" data-start="8" data-duration="10" data-width="1920" data-height="1080" data-track-index="1"></div>

    <!-- Scene 3: Proof (18–38s) -->
    <div id="c-proof" data-composition-id="proof" data-composition-src="compositions/proof.html" data-start="18" data-duration="20" data-width="1920" data-height="1080" data-track-index="1"></div>

    <!-- Scene 4: Flow (41–55s) -->
    <div id="c-flow" data-composition-id="flow" data-composition-src="compositions/flow.html" data-start="41" data-duration="14" data-width="1920" data-height="1080" data-track-index="1"></div>

    <!-- Scene 5: CTA (55–63s) -->
    <div id="c-cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="55" data-duration="8" data-width="1920" data-height="1080" data-track-index="1"></div>

    <script>
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 1920; canvas.height = 1080;
      const grid = 50, pCount = 50, parts = [];
      for (let i = 0; i < pCount; i++) {
        parts.push({ x: Math.sin(i*2.1)*0.5 + 0.5, y: Math.cos(i*3.7)*0.5 + 0.5, r: 1+(i%4), ph: i*1.1 });
      }
      function drawBg(t) {
        const p = t / 63;
        ctx.clearRect(0, 0, 1920, 1080);
        ctx.strokeStyle = 'rgba(124,92,252,0.035)';
        ctx.lineWidth = 1;
        for (let x = 0; x < 1920; x += grid) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke(); }
        for (let y = 0; y < 1080; y += grid) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke(); }
        for (const pt of parts) {
          const px = pt.x * 1920 + Math.sin(p*2 + pt.ph)*25;
          const py = pt.y * 1080 + Math.cos(p*1.5 + pt.ph)*25;
          const a = 0.08 + Math.sin(p*3 + pt.ph)*0.06;
          ctx.beginPath(); ctx.arc(px, py, pt.r, 0, Math.PI*2);
          ctx.fillStyle = `rgba(124,92,252,${a})`;
          ctx.fill();
        }
        const ringR = 180 + Math.sin(p*1.2)*30;
        ctx.beginPath(); ctx.arc(960, 540, ringR, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(255,180,50,${0.025+Math.sin(p*1.2)*0.015})`;
        ctx.lineWidth = 1; ctx.stroke();
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["keeperhub-demo"] = tl;
      window.__hyperframes = window.__hyperframes || {};
      window.__hyperframes.updateFrame = function(t, id) { if (id === 'keeperhub-demo') drawBg(t); };
    </script>
  </div>
</body>
</html>
