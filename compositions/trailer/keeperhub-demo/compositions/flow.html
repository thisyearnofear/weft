<template id="flow-template">

      .f-node.weft .tech { background:rgba(124,92,252,0.12); color:#b088ff; }

    <script>
    (function(){
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const bO = 'back.out(1.6)', pO = 'power3.out', pI = 'power2.in';
      tl.fromTo('#f-title', { y:15, opacity:0 }, { y:0, opacity:1, duration:0.35, ease:pO }, 0.2);

      window.__timelines["flow"] = tl;
