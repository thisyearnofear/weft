<template id="problem-template">
  <div data-composition-id="problem" data-width="1920" data-height="1080" data-start="0" data-duration="10">
    <style>
      [data-composition-id="problem"] {
        width:1920px; height:1080px; position:relative; overflow:hidden;
        font-family:'Inter',system-ui,sans-serif; text-align:center;
      }
      .p-hero { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:0; }
      .p-line { font-size:54px; font-weight:500; line-height:1.35; color:#f0f0f5; letter-spacing:-0.02em; max-width:1200px; }
      .p-line em { font-style:normal; color:#ff4d6d; font-weight:700; }
      .p-accent { font-size:64px; font-weight:800; color:#b088ff; letter-spacing:-0.03em; }
      .p-bar { width:80px; height:2px; background:linear-gradient(90deg, transparent, rgba(124,92,252,0.3), transparent); margin:22px 0; }
      .p-tag {
        position:absolute; font-family:'JetBrains Mono',monospace; font-size:14px;
        color:rgba(255,77,109,0.25); letter-spacing:3px; text-transform:uppercase;
      }
    </style>

    <div class="p-tag" style="top:100px; left:120px; opacity:0">DECIDE ✓</div>
    <div class="p-tag" style="top:130px; right:120px; opacity:0">EXECUTE ✗</div>
    <div class="p-tag" style="bottom:130px; left:140px; opacity:0">MANUAL CAST</div>
    <div class="p-tag" style="bottom:100px; right:100px; opacity:0">NONCE STUCK</div>

    <div class="p-hero">
      <div class="p-line">Milestone escrow needs more than a verdict.</div>
      <div class="p-line" style="margin-top:10px;">It needs <em>reliable onchain execution.</em></div>
      <div class="p-bar"></div>
      <div class="p-accent" style="opacity:0">Who submits the transaction?</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
    (function(){
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const root = document.querySelector('[data-composition-id="problem"]');
      if (!root) { window.__timelines["problem"] = tl; return; }
      const lines = root.querySelectorAll('.p-line');
      const accent = root.querySelector('.p-accent');
      const bar = root.querySelector('.p-bar');
      const tags = root.querySelectorAll('.p-tag');
      tl.fromTo(tags, { opacity:0, y:16 }, { opacity:1, y:0, duration:0.45, stagger:0.12, ease:'power2.out' }, 0);
      tl.fromTo(lines[0], { y:40, opacity:0, filter:'blur(6px)' }, { y:0, opacity:1, filter:'blur(0px)', duration:0.45, ease:'power3.out' }, 0.4);
      tl.fromTo(lines[1], { y:40, opacity:0, filter:'blur(6px)' }, { y:0, opacity:1, filter:'blur(0px)', duration:0.45, ease:'power3.out' }, 1.0);
      tl.fromTo(bar, { scaleX:0, opacity:0 }, { scaleX:1, opacity:1, duration:0.3, ease:'power3.out' }, 1.7);
      tl.fromTo(accent, { scale:0.5, opacity:0 }, { scale:1, opacity:1, duration:0.5, ease:'back.out(1.4)' }, 2.2);
      tl.to(tags, { opacity:0, duration:0.2 }, 8.8);
      tl.to(lines, { y:-30, opacity:0, duration:0.2, stagger:0.05 }, 9.0);
      tl.to(bar, { opacity:0, duration:0.15 }, 9.1);
      tl.to(accent, { opacity:0, scale:0.8, duration:0.2 }, 9.2);
      window.__timelines["problem"] = tl;
    })();
    </script>
  </div>
</template>
