<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <title>Weft — Trailer v3</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    body { margin:0; background:#09050f; color:#f0f0f5; font-family:'Inter',system-ui,sans-serif; overflow:hidden; width:1920px; height:1080px; }
    #root { position:relative; width:1920px; height:1080px; overflow:hidden; background:radial-gradient(ellipse at 50% 30%, #12091f 0%, #09050f 70%); }
    canvas#bg-canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    [data-composition-id] > div[data-composition-id] { position:absolute; inset:0; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="weft-trailer" data-width="1920" data-height="1080" data-duration="35" data-start="0">
    <canvas id="bg-canvas" class="clip" data-start="0" data-duration="35" data-track-index="0"></canvas>

    <!-- Scene 1: Problem (0-4s) -->
    <div id="c-problem" data-composition-id="problem" data-composition-src="compositions/problem.html" data-start="0" data-duration="4" data-width="1920" data-height="1080" data-track-index="1"></div>

    <!-- Scene 2: Dual Architecture (4-14s) -->
    <div id="c-dual" data-composition-id="dual" data-composition-src="compositions/dual.html" data-start="4" data-duration="10" data-width="1920" data-height="1080" data-track-index="1"></div>

    <!-- Scene 3: FHE Deep Dive (14-22s) -->
    <div id="c-fhe" data-composition-id="fhe" data-composition-src="compositions/fhe.html" data-start="14" data-duration="8" data-width="1920" data-height="1080" data-track-index="1"></div>

    <!-- Scene 4: Benefits (22-28s) -->
    <div id="c-benefits" data-composition-id="benefits" data-composition-src="compositions/benefits.html" data-start="22" data-duration="6" data-width="1920" data-height="1080" data-track-index="1"></div>

    <!-- Scene 5: CTA (28-35s) -->
    <div id="c-cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="28" data-duration="7" data-width="1920" data-height="1080" data-track-index="1"></div>

    <script>
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 1920; canvas.height = 1080;
      const grid = 50, pCount = 60, parts = [];
      for (let i = 0; i < pCount; i++) {
        parts.push({ x: Math.sin(i*2.1)*0.5 + 0.5, y: Math.cos(i*3.7)*0.5 + 0.5, r: 1+(i%4), s: 0.015+(i%7)*0.004, ph: i*1.1 });
      }
      let time = 0;
      function drawBg(t) {
        time = t;
        const p = t / 35;
        ctx.clearRect(0, 0, 1920, 1080);
        ctx.strokeStyle = 'rgba(124,92,252,0.04)';
        ctx.lineWidth = 1;
        for (let x = 0; x < 1920; x += grid) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke(); }
        for (let y = 0; y < 1080; y += grid) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke(); }
        for (const pt of parts) {
          const px = pt.x * 1920 + Math.sin(p*2 + pt.ph)*30;
          const py = pt.y * 1080 + Math.cos(p*1.5 + pt.ph)*30;
          const a = 0.1 + Math.sin(p*3 + pt.ph)*0.08;
          ctx.beginPath(); ctx.arc(px, py, pt.r, 0, Math.PI*2);
          ctx.fillStyle = `rgba(124,92,252,${a})`;
          ctx.fill();
        }
        const ringR = 200 + Math.sin(p*1.5)*40;
        ctx.beginPath(); ctx.arc(960, 540, ringR, 0, Math.PI*2);
        ctx.strokeStyle = `rgba(124,92,252,${0.03+Math.sin(p*1.5)*0.02})`;
        ctx.lineWidth = 1; ctx.stroke();
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["weft-trailer"] = tl;
      window.__hyperframes = window.__hyperframes || {};
      window.__hyperframes.updateFrame = function(t, id) { if (id === 'weft-trailer') drawBg(t); };
    </script>
  </div>
</body>
</html>
