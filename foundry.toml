[profile.default]
# Keep Solidity components scoped to /contracts to stay modular with other repo domains
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
cache_path = "contracts/cache"

solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true

# Reproducible builds
cbor_metadata = false
bytecode_hash = "none"

[profile.fhe]
# FHEVM confidential contracts — additive, separate source/test dirs
src = "contracts/src-fhe"
test = "contracts/test-fhe"
script = "contracts/script-fhe"
out = "contracts/out-fhe"
cache_path = "contracts/cache-fhe"
libs = ["lib", "dependencies"]
solc_version = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 800
via_ir = true
cbor_metadata = false
bytecode_hash = "none"
remappings = [
    "@fhevm/host-contracts/=dependencies/forge-fhevm-eba2324/src/fhevm-host/",
    "@fhevm/solidity/=dependencies/@fhevm-solidity-0.11.1/",
    "encrypted-types/=dependencies/@encrypted-types-0.0.4/",
    "forge-fhevm/=dependencies/forge-fhevm-eba2324/src/",
    "forge-std/=dependencies/forge-std-1.14.0/src",
]

[fuzz]
runs = 256

[fmt]
line_length = 100
tab_width = 4

[dependencies]
"@fhevm-solidity" = "0.11.1"
"@encrypted-types" = "0.0.4"
forge-fhevm = { version = "eba2324", git = "https://github.com/zama-ai/forge-fhevm.git", rev = "eba232440117cf17e0f45be7a337b5dd64a50635" }
forge-std = "1.14.0"

[soldeer]
remappings_version = false
recursive_deps = true
