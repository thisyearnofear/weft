<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a16"/>
      <stop offset="100%" stop-color="#07070f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10" fill="#6366f1" opacity="0.7"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10" fill="#22c55e" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="url(#bg)" rx="16"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#e8e8f2" font-size="18" font-weight="700" letter-spacing="-0.02em">Weft Architecture</text>
  <text x="450" y="48" text-anchor="middle" fill="#8892a4" font-size="11">Autonomous Capital Release for the Agentic Economy</text>

  <!-- ─── LAYER 1: 0G Chain (bottom) ─── -->
  <rect x="40" y="400" width="820" height="105" rx="12" fill="rgba(99, 102, 241, 0.06)" stroke="rgba(99, 102, 241, 0.15)" stroke-width="1"/>
  <text x="60" y="420" fill="#6366f1" font-size="10" font-weight="700">0G CHAIN — GALILEO TESTNET</text>

  <!-- Contract boxes -->
  <rect x="60" y="430" width="200" height="50" rx="8" fill="rgba(99, 102, 241, 0.1)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1" filter="url(#shadow)"/>
  <text x="160" y="452" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">WeftMilestone.sol</text>
  <text x="160" y="468" text-anchor="middle" fill="#8892a4" font-size="9">Milestone escrow + voting</text>

  <rect x="290" y="430" width="200" height="50" rx="8" fill="rgba(99, 102, 241, 0.1)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1" filter="url(#shadow)"/>
  <text x="390" y="452" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">VerifierRegistry.sol</text>
  <text x="390" y="468" text-anchor="middle" fill="#8892a4" font-size="9">Authorized verifier nodes</text>

  <rect x="520" y="430" width="200" height="50" rx="8" fill="rgba(99, 102, 241, 0.1)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1" filter="url(#shadow)"/>
  <text x="620" y="452" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">KeeperHub</text>
  <text x="620" y="468" text-anchor="middle" fill="#8892a4" font-size="9">Reliable tx execution</text>

  <!-- Area label -->
  <text x="760" y="420" fill="#6366f1" font-size="9" font-family="monospace" opacity="0.6">explorer-testnet.0g.ai</text>

  <!-- ─── LAYER 2: 0G Storage (middle) ─── -->
  <rect x="40" y="275" width="820" height="110" rx="12" fill="rgba(34, 197, 94, 0.05)" stroke="rgba(34, 197, 94, 0.12)" stroke-width="1"/>
  <text x="60" y="295" fill="#22c55e" font-size="10" font-weight="700">0G STORAGE — AGENT MEMORY LAYER</text>

  <rect x="60" y="305" width="240" height="60" rx="8" fill="rgba(34, 197, 94, 0.08)" stroke="rgba(34, 197, 94, 0.2)" stroke-width="1"/>
  <text x="180" y="325" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">KV (Real-Time State)</text>
  <text x="180" y="341" text-anchor="middle" fill="#6ee7b7" font-size="8.5" font-family="monospace">weft:milestone:&lt;hash&gt;:state</text>
  <text x="180" y="354" text-anchor="middle" fill="#8892a4" font-size="8" font-family="monospace">weft:milestone:&lt;hash&gt;:consensus</text>

  <rect x="330" y="305" width="240" height="60" rx="8" fill="rgba(34, 197, 94, 0.08)" stroke="rgba(34, 197, 94, 0.2)" stroke-width="1"/>
  <text x="450" y="325" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">Log (Immutable History)</text>
  <text x="450" y="341" text-anchor="middle" fill="#6ee7b7" font-size="8.5" font-family="monospace">weft:milestone:&lt;hash&gt;:chronicle</text>
  <text x="450" y="354" text-anchor="middle" fill="#8892a4" font-size="8" font-family="monospace">weft:milestone:&lt;hash&gt;:history</text>

  <rect x="600" y="305" width="240" height="60" rx="8" fill="rgba(34, 197, 94, 0.08)" stroke="rgba(34, 197, 94, 0.2)" stroke-width="1"/>
  <text x="720" y="325" text-anchor="middle" fill="#86efac" font-size="11" font-weight="600">Bundles</text>
  <text x="720" y="341" text-anchor="middle" fill="#6ee7b7" font-size="8.5" font-family="monospace">bundle.tar.gz</text>
  <text x="720" y="354" text-anchor="middle" fill="#8892a4" font-size="8" font-family="monospace">bundle_manifest.json</text>

  <!-- ─── LAYER 3: Agent Layer (top) ─── -->
  <rect x="40" y="65" width="820" height="195" rx="12" fill="rgba(139, 92, 246, 0.05)" stroke="rgba(139, 92, 246, 0.12)" stroke-width="1"/>
  <text x="60" y="85" fill="#8b5cf6" font-size="10" font-weight="700">HERMES AGENT SWARM — VERIFICATION LAYER</text>

  <!-- Three node boxes -->
  <g>
    <rect x="60" y="95" width="190" height="145" rx="10" fill="rgba(139, 92, 246, 0.06)" stroke="rgba(139, 92, 246, 0.18)" stroke-width="1" filter="url(#shadow)"/>
    <text x="155" y="115" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">Verifier Node 1</text>
    <text x="155" y="130" text-anchor="middle" fill="#8892a4" font-size="8">DeadlineScheduler</text>
    <text x="155" y="144" text-anchor="middle" fill="#8892a4" font-size="8">mvp_verifier</text>
    <text x="155" y="158" text-anchor="middle" fill="#8892a4" font-size="8">github_client</text>
    <text x="155" y="172" text-anchor="middle" fill="#8892a4" font-size="8">kimi_client</text>
    <text x="155" y="186" text-anchor="middle" fill="#8892a4" font-size="8">axl_client</text>
    <text x="155" y="200" text-anchor="middle" fill="#8892a4" font-size="8">keeperhub_client</text>
    <text x="155" y="214" text-anchor="middle" fill="#8892a4" font-size="8">ens_client</text>
    <text x="155" y="228" text-anchor="middle" fill="#8892a4" font-size="8">fal_client</text>
  </g>

  <g>
    <rect x="350" y="95" width="190" height="145" rx="10" fill="rgba(139, 92, 246, 0.06)" stroke="rgba(139, 92, 246, 0.18)" stroke-width="1" filter="url(#shadow)"/>
    <text x="445" y="115" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">Verifier Node 2</text>
    <text x="445" y="130" text-anchor="middle" fill="#8892a4" font-size="8">DeadlineScheduler</text>
    <text x="445" y="144" text-anchor="middle" fill="#8892a4" font-size="8">mvp_verifier</text>
    <text x="445" y="158" text-anchor="middle" fill="#8892a4" font-size="8">github_client</text>
    <text x="445" y="172" text-anchor="middle" fill="#8892a4" font-size="8">kimi_client</text>
    <text x="445" y="186" text-anchor="middle" fill="#8892a4" font-size="8">axl_client</text>
    <text x="445" y="200" text-anchor="middle" fill="#8892a4" font-size="8">keeperhub_client</text>
    <text x="445" y="214" text-anchor="middle" fill="#8892a4" font-size="8">ens_client</text>
    <text x="445" y="228" text-anchor="middle" fill="#8892a4" font-size="8">fal_client</text>
  </g>

  <g>
    <rect x="645" y="95" width="190" height="145" rx="10" fill="rgba(139, 92, 246, 0.06)" stroke="rgba(139, 92, 246, 0.18)" stroke-width="1" filter="url(#shadow)"/>
    <text x="740" y="115" text-anchor="middle" fill="#c4b5fd" font-size="11" font-weight="600">Verifier Node 3</text>
    <text x="740" y="130" text-anchor="middle" fill="#8892a4" font-size="8">DeadlineScheduler</text>
    <text x="740" y="144" text-anchor="middle" fill="#8892a4" font-size="8">mvp_verifier</text>
    <text x="740" y="158" text-anchor="middle" fill="#8892a4" font-size="8">github_client</text>
    <text x="740" y="172" text-anchor="middle" fill="#8892a4" font-size="8">kimi_client</text>
    <text x="740" y="186" text-anchor="middle" fill="#8892a4" font-size="8">axl_client</text>
    <text x="740" y="200" text-anchor="middle" fill="#8892a4" font-size="8">keeperhub_client</text>
    <text x="740" y="214" text-anchor="middle" fill="#8892a4" font-size="8">ens_client</text>
    <text x="740" y="228" text-anchor="middle" fill="#8892a4" font-size="8">fal_client</text>
  </g>

  <!-- AXL P2P lines between nodes -->
  <line x1="250" y1="167" x2="350" y2="167" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="180" x2="250" y2="180" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="167" x2="645" y2="167" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.5" marker-end="url(#arrow)"/>
  <line x1="645" y1="180" x2="540" y2="180" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.5" marker-end="url(#arrow)"/>

  <!-- AXL label -->
  <text x="300" y="146" fill="#a78bfa" font-size="7.5" font-family="monospace" opacity="0.6">AXL encrypted P2P</text>

  <!-- ─── ARROWS between layers ─── -->

  <!-- Agent → 0G Storage -->
  <line x1="155" y1="240" x2="180" y2="305" stroke="#22c55e" stroke-width="1.5" opacity="0.5" marker-end="url(#arrowGreen)"/>
  <line x1="445" y1="240" x2="450" y2="305" stroke="#22c55e" stroke-width="1.5" opacity="0.5" marker-end="url(#arrowGreen)"/>
  <line x1="740" y1="240" x2="720" y2="305" stroke="#22c55e" stroke-width="1.5" opacity="0.5" marker-end="url(#arrowGreen)"/>

  <!-- 0G Storage → 0G Chain -->
  <line x1="160" y1="365" x2="160" y2="430" stroke="#6366f1" stroke-width="1.5" opacity="0.5" marker-end="url(#arrow)"/>
  <line x1="390" y1="365" x2="390" y2="430" stroke="#6366f1" stroke-width="1.5" opacity="0.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="365" x2="620" y2="430" stroke="#6366f1" stroke-width="1.5" opacity="0.5" marker-end="url(#arrow)"/>

  <!-- ─── Side labels ─── -->
  <text x="15" y="170" fill="#8892a4" font-size="8" font-family="monospace" transform="rotate(-90, 15, 170)" text-anchor="middle" opacity="0.5">offchain evidence</text>
  <text x="15" y="330" fill="#8892a4" font-size="8" font-family="monospace" transform="rotate(-90, 15, 330)" text-anchor="middle" opacity="0.5">persistent memory</text>
  <text x="15" y="455" fill="#8892a4" font-size="8" font-family="monospace" transform="rotate(-90, 15, 455)" text-anchor="middle" opacity="0.5">onchain settlement</text>

  <!-- ─── Legend ─── -->
  <circle cx="690" y="85" r="4" fill="#22c55e" opacity="0.8"/>
  <text x="700" y="88" fill="#8892a4" font-size="9">0G Storage</text>
  <circle cx="770" y="85" r="4" fill="#6366f1" opacity="0.8"/>
  <text x="780" y="88" fill="#8892a4" font-size="9">0G Chain</text>

</svg>